name: E2E tests
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4

      - run: corepack enable

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build app
        run: pnpm build

      - name: Restore Playwright browsers from cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}-${{ hashFiles('**/playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        # browser CDN downloads occasionally hang forever; bound the step so
        # the retry loop takes over, and bound each connection attempt
        # --with-deps runs apt-get for the full browser dependency set; the
        # ubuntu archive can be very slow at peak, so allow up to 15 minutes
        timeout-minutes: 15
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000
        run: |
          for attempt in 1 2 3; do
            if ./node_modules/.bin/playwright install --with-deps; then
              exit 0
            fi
            echo "playwright install attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Run Playwright tests
        run: pnpm run test:e2e --shard=${{ matrix.shard }}
