about:
  content: >
    # Sobre Toolbox

    Este maravilloso sitio web agrega herramientas útiles para desarrolladores y personas que trabajan en IT. Si lo encuentra útil, no dude en compartirlo con las personas que crea que también pueden encontrarlo útil y ¡no olvide marcarlo como favorito en su barra de accesos directos!

    Toolbox es un fork de [IT-Tools](https://github.com/CorentinTh/it-tools), hecho con ❤ por [Corentin Thomasset](https://corentin.tech). [destan](https://github.com/destan) mantiene este fork.

    Toolbox es de código abierto (under the GPL-3.0 license) y gratis, y siempre lo será.

    ## Tecnologías

    Toolbox está creado en Vue.js (Vue 3) con la biblioteca de componentes Naive UI y Cloudflare lo aloja y lo implementa continuamente. En algunas herramientas se utilizan bibliotecas de código abierto de terceros; puede encontrar la lista completa en [package.json](https://github.com/destan/toolbox/blob/main/package.json) archivo del repositorio.

    ## ¿Encontraste un error? ¿Falta una herramienta?

    Si necesita una herramienta que actualmente no está presente aquí y cree que puede ser útil, puede enviar una solicitud de función en el [issues section](https://github.com/destan/toolbox/issues/new/choose) en el repositorio de GitHub.

    Y si encontró un error o algo no funciona como se esperaba, presente un reporte de error en el [issues section](https://github.com/destan/toolbox/issues/new/choose) en el repositorio de GitHub.

