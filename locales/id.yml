    description: Konversi warna antar format yang berbeda (hex, rgb, hsl, dan nama CSS)

  bcrypt:
    title: Bcrypt
    description: Hash dan bandingkan string teks menggunakan bcrypt. Bcrypt adalah fungsi penghash password berdasarkan cipher Blowfish.

  crontab-generator:
    title: Generator crontab
    description: Validasi dan buat crontab serta dapatkan deskripsi jadwal cron yang mudah dibaca.

  http-status-codes:
