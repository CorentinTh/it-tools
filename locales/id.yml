    description: Daftar semua kode status HTTP, nama, dan artinya.

  sql-prettify:
    title: Format dan prettify SQL
    description: Format dan rapikan kueri SQL Anda secara online (mendukung berbagai dialek SQL).

  benchmark-builder:
    title: Pembuat benchmark
    description: Bandingkan waktu eksekusi tugas dengan pembuat benchmark online yang sangat sederhana ini.

  git-memo:
    title: Catatan cepat Git
    description: Git adalah perangkat lunak manajemen versi terdistribusi. Dengan catatan cepat ini, Anda akan dengan cepat mengakses perintah Git yang paling umum.

  slugify-string:
    title: Slugify string
    description: Jadikan URL, nama file, dan ID dari string aman.

  encryption:
    title: Enkripsi / dekripsi teks
    description: Enkripsi teks jelas dan dekripsi ciphertext menggunakan algoritma kripto seperti AES, TripleDES, Rabbit, atau RC4.

  random-port-generator:
    title: Generator port acak
    description: Buat nomor port acak di luar rentang port yang "dikenal" (0-1023).

  yaml-prettify:
    title: Format dan prettify YAML
    description: Rapikan string YAML Anda menjadi format yang lebih ramah dan mudah dibaca.

  eta-calculator:
    title: Kalkulator ETA
    description: Kalkulator ETA (Estimated Time of Arrival) untuk menentukan waktu akhir yang kira-kira dari suatu tugas, misalnya waktu akhir dan durasi unduhan file.

  roman-numeral-converter:
    title: Konverter angka Romawi
    description: Konversi angka Romawi ke angka dan sebaliknya.

  hmac-generator:
    title: Generator HMAC
    description: Menghitung kode otentikasi pesan berbasis hash (HMAC) menggunakan kunci rahasia dan fungsi hash favorit Anda.

  bip39-generator:
    title: Generator frasa sandi BIP39
    description: Buat frasa sandi BIP39 dari mnemonic yang ada atau acak, atau dapatkan mnemonic dari frasa sandi.

  base64-file-converter:
    title: Konverter file Base64
    description: Konversi string, file, atau gambar ke representasi Base64-nya.

  list-converter:
    title: Konverter daftar
    description: Alat ini dapat memproses data berbasis kolom dan menerapkan berbagai perubahan (transpos, tambah awalan dan akhiran, balik urutan daftar, urutkan daftar, ubah ke huruf kecil, potong nilai) pada setiap baris.

  base64-string-converter:
    title: Pengkodean/penguraian string Base64
    description: Sederhanakan pengkodean dan penguraian string ke bentuk Base64.

  toml-to-yaml:
    title: TOML ke YAML
    description: Parse dan konversi TOML ke YAML.

  math-evaluator:
