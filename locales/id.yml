about:
  content: >
    # Tentang IT-Tools

    Situs web yang luar biasa ini, dibuat dengan ❤ oleh [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), mengumpulkan alat-alat berguna bagi developer dan orang yang bekerja di bidang IT. Jika Anda merasa bermanfaat, silakan bagikan ke orang yang menurut Anda juga mungkin membutuhkannya dan jangan lupa menandainya di bilah pintasan Anda!

    IT Tools adalah open-source (di bawah lisensi GPL-3.0) dan gratis, dan akan selalu demikian, tetapi saya mengeluarkan uang untuk hosting dan memperbarui nama domain. Jika Anda ingin mendukung pekerjaan saya dan mendorong saya untuk menambahkan lebih banyak alat lagi, silakan pertimbangkan untuk mendukung melalui [sponsorship saya](https://www.buymeacoffee.com/cthmsst).

    ## Teknologi

    IT Tools dibuat dengan Vue.js (Vue 3) menggunakan library komponen Naive UI dan di-hosting serta dideploy secara terus-menerus oleh Vercel. Pustaka open-source pihak ketiga digunakan di beberapa alat; Anda dapat menemukan daftar lengkapnya di file [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) di repositori.

    ## Menemukan bug? Alat belum ada?

    Jika Anda membutuhkan alat yang saat ini belum tersedia di sini, dan menurut Anda bermanfaat, Anda dipersilakan untuk mengajukan permintaan fitur di [bagian issues](https://github.com/CorentinTh/it-tools/issues/new/choose) di repositori GitHub.

    Dan jika Anda menemukan bug, atau sesuatu tidak berfungsi sesuai harapan, silakan kirim laporan bug di [bagian issues](https://github.com/CorentinTh/it-tools/issues/new/choose) di repositori GitHub.

