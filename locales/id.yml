    description: Deteksi dan parse Browser, Engine, OS, CPU, serta tipe/model perangkat dari string user-agent.

  numeronym-generator:
    title: Generator numeronym
    description: Numeronym adalah kata yang menggunakan angka untuk membentuk singkatan. Misalnya, "i18n" adalah numeronym dari "internationalization" di mana 18 menggantikan jumlah huruf antara i awal dan n akhir.

  case-converter:
