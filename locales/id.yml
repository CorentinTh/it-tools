    description: Ubah bentuk huruf string dan pilih berbagai format

  html-entities:
    title: Escape HTML entities
    description: Escape atau unescape entitas HTML (ganti karakter seperti <, >, &, " dan ' dengan versi HTML-nya)

  json-prettify:
    title: Format dan prettify JSON
    description: Rapikan string JSON Anda menjadi format yang lebih ramah dan mudah dibaca.

  docker-run-to-docker-compose-converter:
