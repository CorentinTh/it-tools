  url-parser:
    title: Pengurai URL
    description: Parse URL menjadi bagian-bagiannya secara terpisah (protokol, origin, parameter, port, username-password, ...)

  iban-validator-and-parser:
    title: Validator dan pengurai IBAN
    description: Validasi dan parse nomor IBAN. Cek apakah IBAN valid dan dapatkan negara, BBAN, apakah itu QR-IBAN, serta format ramah IBAN.

