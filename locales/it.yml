about:
  content: >
    # Informazioni su IT-Tools

    Questo splendido sito, realizzato con ❤ da [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), raccoglie strumenti utili per sviluppatori e professionisti IT. Se lo trovi utile, condividilo con chi pensi possa apprezzarlo e non dimenticare di aggiungerlo ai preferiti!

    IT Tools è open-source (con licenza GPL-3.0) e gratuito, e lo sarà sempre, ma l'hosting e il rinnovo del dominio hanno un costo. Se vuoi sostenere il mio lavoro e incoraggiarmi ad aggiungere altri strumenti, valuta la possibilità di supportarmi [offrendomi una donazione](https://www.buymeacoffee.com/cthmsst).

    ## Tecnologie

    IT Tools è realizzato con Vue.js (Vue 3) con la libreria di componenti Naive UI, ed è ospitato e distribuito continuamente da Vercel. In alcuni strumenti vengono utilizzate librerie open-source di terze parti; l'elenco completo è disponibile nel file [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) del repository.

    ## Trovato un bug? Manca uno strumento?

    Se ti serve uno strumento attualmente non presente e pensi possa essere utile, sei invitato a proporlo nella sezione [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) del repository GitHub.

    E se hai trovato un bug o qualcosa non funziona come previsto, segnalalo nella sezione [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) del repository GitHub.

