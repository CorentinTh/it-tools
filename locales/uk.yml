    description: Дізнайтеся JavaScript keycode, code, розташування та модифікатори будь-якої натиснутої клавіші.

  emoji-picker:
    title: Вибір емодзі
    description: Легко копіюйте та вставляйте емодзі, а також отримуйте їхні значення Unicode та кодові точки.

  color-converter:
    title: Конвертер кольорів
    description: Конвертуйте кольори між різними форматами (hex, rgb, hsl та назвами CSS).

  bcrypt:
    title: Bcrypt
    description: Хешуйте та порівнюйте текстові рядки за допомогою bcrypt. Bcrypt — це функція хешування паролів, що базується на шифрі Blowfish.

  crontab-generator:
    title: Генератор Crontab
    description: Перевіряйте та генеруйте crontab, а також отримуйте зрозумілий для людини опис розкладу cron.

  http-status-codes:
    title: Коди стану HTTP
    description: Список усіх кодів стану HTTP, їхні назви та значення.

  sql-prettify:
    title: Форматування SQL
    description: Форматуйте свої SQL-запити онлайн (підтримуються різні діалекти SQL).

  benchmark-builder:
    title: Створення бенчмарків
    description: Легко порівнюйте час виконання завдань за допомогою цього дуже простого онлайн-інструменту.

  git-memo:
    title: Шпаргалка з Git
    description: Git — це децентралізована система керування версіями. З цією шпаргалкою ви матимете швидкий доступ до найпоширеніших команд git.

