    description: Універсальний унікальний ідентифікатор (UUID) — це 128-бітне число, що використовується для ідентифікації інформації в комп'ютерних системах. Кількість можливих UUID дорівнює 16^32, тобто 2^128 або близько 3.4x10^38 (це дуже багато!).

  ipv4-address-converter:
    title: Конвертер адрес IPv4
    description: Перетворіть IP-адресу в десяткове, двійкове, шістнадцяткове або навіть IPv6-подання.

  text-statistics:
    title: Статистика тексту
    description: Отримайте інформацію про текст, кількість символів, кількість слів, його розмір у байтах тощо.

  text-to-nato-alphabet:
    title: Текст у алфавіт НАТО
    description: Перетворіть текст у фонетичний алфавіт НАТО для усної передачі.

  basic-auth-generator:
    title: Генератор Basic auth
    description: Згенеруйте заголовок basic auth у форматі base64 з імені користувача та пароля.

  text-to-unicode:
    title: Текст у Unicode
    description: Аналізуйте та конвертуйте текст у Unicode і навпаки.

  ipv4-range-expander:
    title: Розширювач діапазону IPv4
    description: Отримавши початкову та кінцеву IPv4-адреси, цей інструмент обчислює дійсну підмережу IPv4 разом із її нотацією CIDR.

  text-diff:
    title: Порівняння тексту
    description: Порівняйте два тексти і побачте відмінності між ними.

  otp-generator:
    title: Генератор OTP-кодів
    description: Генеруйте та перевіряйте одноразові паролі на основі часу (OTP) для багатофакторної автентифікації.

