    description: Мініфікуйте та стисніть ваш JSON, видаливши непотрібні пробіли.

  ulid-generator:
    title: Генератор ULID
    description: Генеруйте випадкові універсально унікальні лексикографічно сортовані ідентифікатори (ULID).

  string-obfuscator:
    title: Обфускатор рядків
    description: Обфускуйте рядок (наприклад, секрет, IBAN або токен), щоб зробити його придатним для спільного використання та ідентифікації без розкриття його вмісту.

  base-converter:
