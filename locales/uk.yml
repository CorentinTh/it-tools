about:
  content: >
    # Про IT-Tools

    Цей чудовий вебсайт, створений [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) з ❤, збирає корисні інструменти для розробників та людей, що працюють в IT. Якщо ви вважаєте його корисним, будь ласка, поділіться ним з тими, кому він також може стати в пригоді, і не забудьте додати його до своїх закладок!

    IT Tools — це проєкт з відкритим вихідним кодом (під ліцензією GPL-3.0), він безкоштовний і завжди таким буде, але хостинг та продовження доменного імені коштують мені грошей. Якщо ви хочете підтримати мою роботу і заохотити мене додавати нові інструменти, будь ласка, розгляньте можливість [стати спонсором](https://www.buymeacoffee.com/cthmsst).

    ## Технології

    IT Tools створений за допомогою Vue.js (Vue 3) з використанням бібліотеки компонентів Naive UI, хоститься та безперервно розгортається за допомогою Vercel. У деяких інструментах використовуються сторонні бібліотеки з відкритим вихідним кодом, повний список яких можна знайти у файлі [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) у репозиторії.

    ## Знайшли помилку? Не вистачає інструменту?

    Якщо вам потрібен інструмент, якого наразі тут немає, і ви вважаєте, що він може бути корисним, ви можете надіслати запит на додавання нової функції в розділі [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) у репозиторії на GitHub.

    А якщо ви знайшли помилку, або щось працює не так, як очікувалося, будь ласка, повідомте про помилку в розділі [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) у репозиторії на GitHub.

