about:
  content: >
    # IT-Tools Hakkında

    [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) tarafından ❤ ile hazırlanan bu harika web sitesi, geliştiriciler ve bilişim alanında çalışan kişiler için kullanışlı araçları bir araya getirir. Yararlı bulduysanız lütfen faydalanabileceğini düşündüğünüz kişilerle paylaşmaktan çekinmeyin ve yer işaretlerinize eklemeyi unutmayın!

    IT Tools açık kaynaklıdır (GPL-3.0 lisansı altında), ücretsizdir ve her zaman öyle kalacaktır; ancak barındırma ve alan adı yenileme maliyetleri bulunmaktadır. Çalışmalarımı desteklemek ve daha fazla araç eklememi teşvik etmek isterseniz lütfen [bana sponsor olmayı](https://www.buymeacoffee.com/cthmsst) değerlendirin.

    ## Teknolojiler

    IT Tools, Naive UI bileşen kütüphanesi ile Vue.js (Vue 3) kullanılarak geliştirilmiştir ve Vercel tarafından barındırılıp sürekli olarak dağıtılmaktadır (CI/CD). Bazı araçlarda üçüncü taraf açık kaynak kütüphaneler kullanılmıştır; tam listeyi depodaki [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) dosyasında bulabilirsiniz.

    ## Bir hata mı buldunuz? Bir araç mı eksik?

    Şu anda burada bulunmayan ve yararlı olabileceğini düşündüğünüz bir araca ihtiyacınız varsa, GitHub deposundaki [sorunlar (issues) bölümünden](https://github.com/CorentinTh/it-tools/issues/new/choose) özellik isteği gönderebilirsiniz.

    Bir hata bulduysanız veya bir şey beklendiği gibi çalışmıyorsa lütfen GitHub deposundaki [sorunlar (issues) bölümünden](https://github.com/CorentinTh/it-tools/issues/new/choose) bir hata bildirimi oluşturun.

