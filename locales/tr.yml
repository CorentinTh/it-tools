  yaml-to-toml:
    title: YAML'dan TOML'a
    description: YAML verilerini ayrıştırın ve TOML'a dönüştürün.

  mac-address-generator:
    title: MAC adresi oluşturucu
    description: Miktar ve ön ek girin. MAC adresleri seçtiğiniz harf durumunda (büyük veya küçük harf) oluşturulacaktır.

