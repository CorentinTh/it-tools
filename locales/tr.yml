  svg-placeholder-generator:
    title: SVG yer tutucu (placeholder) oluşturucu
    description: Uygulamalarınızda yer tutucu olarak kullanmak üzere SVG görselleri oluşturun.

  json-to-csv:
    title: JSON'dan CSV'ye
    description: Otomatik başlık algılama ile JSON verilerini CSV formatına dönüştürün.

  camera-recorder:
    title: Kamera kaydedici
    description: Web kameranızdan veya kameranızdan fotoğraf çekin ya da video kaydedin.

  keycode-info:
    title: Tuş kodu (Keycode) bilgisi
    description: Basılan herhangi bir tuşun javascript tuş kodunu (keycode), kodunu, konumunu ve değiştiricilerini öğrenin.

  emoji-picker:
    title: Emoji seçici
    description: Emojileri kolayca kopyalayıp yapıştırın; her emojinin unicode ve kod noktası değerlerini öğrenin.

  color-converter:
    title: Renk dönüştürücü
    description: Farklı formatlar arasında renk dönüşümü yapın (hex, rgb, hsl ve css adı)

  bcrypt:
    title: Bcrypt
    description: Bcrypt kullanarak metin dizelerini karma hale getirin ve karşılaştırın. Bcrypt, Blowfish şifresine dayalı bir şifre hashleme fonksiyonudur.

  crontab-generator:
    title: Crontab oluşturucu
    description: Crontab ifadelerini doğrulayın, oluşturun ve cron zamanlamasının anlaşılır açıklamasını görün.

  http-status-codes:
    title: HTTP durum kodları
    description: Tüm HTTP durum kodlarının listesi, adları ve anlamları.

  sql-prettify:
    title: SQL güzelleştirici ve biçimlendirici
    description: SQL sorgularınızı çevrimiçi olarak biçimlendirin ve güzelleştirin (çeşitli SQL lehçelerini destekler).

  benchmark-builder:
    title: Karşılaştırmalı test (Benchmark) oluşturucu
    description: Bu çok basit çevrimiçi karşılaştırma aracıyla görevlerin yürütme sürelerini kolayca karşılaştırın.

  git-memo:
    title: Git başvuru kılavuzu (Cheatsheet)
    description: Git dağıtık bir sürüm kontrol yazılımıdır. Bu başvuru kılavuzu ile en yaygın Git komutlarına hızlıca erişebilirsiniz.

  slugify-string:
    title: Dizeyi URL uyumlu yap (Slugify)
    description: Bir metni URL, dosya adı ve kimlik (id) için güvenli hale getirin.

  encryption:
    title: Metin şifreleme / şifre çözme
    description: AES, TripleDES, Rabbit veya RC4 gibi kripto algoritmalarını kullanarak düz metni şifreleyin ve şifreli metni çözün.

  random-port-generator:
    title: Rastgele port oluşturucu
    description: Bilinen port aralığının (0-1023) dışında rastgele port numaraları oluşturun.

  yaml-prettify:
    title: YAML güzelleştirici ve biçimlendirici
    description: YAML dizenizi anlaşılır ve okunabilir bir biçime dönüştürün.

  eta-calculator:
    title: ETA (Tahmini Varış Süresi) hesaplayıcı
    description: Bir görevin yaklaşık bitiş zamanını (örneğin bir dosya indirmesinin bitiş zamanını ve süresini) belirlemek için ETA hesaplayıcı.

  roman-numeral-converter:
    title: Romen rakamı dönüştürücü
    description: Romen rakamlarını sayılara, sayıları da Romen rakamlarına dönüştürün.

  hmac-generator:
    title: HMAC oluşturucu
    description: Gizli bir anahtar ve tercih ettiğiniz hash fonksiyonunu kullanarak hash tabanlı bir mesaj doğrulama kodu (HMAC) hesaplar.

  bip39-generator:
    title: BIP39 parola dizesi (passphrase) oluşturucu
    description: Mevcut veya rastgele bir anımsatıcıdan (mnemonic) BIP39 parolası oluşturun veya paroladan anımsatıcıyı elde edin.

  base64-file-converter:
    title: Base64 dosya dönüştürücü
    description: Bir metni, dosyayı veya görseli base64 temsiline dönüştürün.

  list-converter:
    title: Liste dönüştürücü
    description: Bu araç sütun tabanlı verileri işleyebilir ve her satıra çeşitli değişiklikler uygulayabilir (satır/sütun yer değiştirme, ön ek ve son ek ekleme, listeyi tersine çevirme, sıralama, küçük harfe dönüştürme, değerleri kısaltma).

  base64-string-converter:
    title: Base64 metin kodlayıcı/kod çözücü
    description: Metin dizelerini base64 temsiline kolayca kodlayın veya kodunu çözün.

  toml-to-yaml:
    title: TOML'dan YAML'a
    description: TOML verilerini ayrıştırın ve YAML'a dönüştürün.

  math-evaluator:
    title: Matematiksel ifade değerlendirici
    description: Matematiksel ifadeleri hesaplamak için bir hesap makinesi. sqrt, cos, sin, abs vb. fonksiyonları kullanabilirsiniz.

  json-to-yaml-converter:
    title: JSON'dan YAML'a dönüştürücü
    description: Bu canlı çevrimiçi dönüştürücü ile JSON'u kolayca YAML'a dönüştürün.

  url-parser:
