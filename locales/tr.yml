  text-diff:
    title: Metin karşılaştırma (diff)
    description: İki metni karşılaştırın ve aralarındaki farkları görün.

  otp-generator:
    title: OTP kod oluşturucu
    description: Çok faktörlü kimlik doğrulama için zamana dayalı OTP (tek kullanımlık şifre) oluşturun ve doğrulayın.

  url-encoder:
