about:
  content: >
    # О IT-Tools

    Этот замечательный сайт, созданный с ❤ [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), объединяет полезные инструменты для разработчиков и людей, работающих в IT. Если вы находите его полезным, пожалуйста, поделитесь им с людьми, которые также могут найти его полезным, и не забудьте добавить его в закладки!

    IT Tools является открытым исходным кодом (по лицензии GPL-3.0) и бесплатным, и всегда будет таким, но мне стоят денег хостинг и продление доменного имени. Если вы хотите поддержать мою работу и поощрить меня добавлять больше инструментов, пожалуйста, рассмотрите возможность поддержки через [спонсорство](https://www.buymeacoffee.com/cthmsst).

    ## Технологии

    IT Tools создан на Vue.js (Vue 3) с библиотекой компонентов Naive UI и размещён и непрерывно развёртывается с помощью Vercel. В некоторых инструментах используются сторонние библиотеки с открытым исходным кодом, полный список можно найти в файле [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) репозитория.

    ## Нашли ошибку? Не хватает инструмента?

    Если вам нужен инструмент, которого сейчас здесь нет, и вы думаете, что он может быть полезен, вы можете отправить запрос на функцию в [разделе issues](https://github.com/CorentinTh/it-tools/issues/new/choose) в репозитории GitHub.

    И если вы нашли ошибку или что-то работает не так, как ожидалось, пожалуйста, сообщите об этом в [разделе issues](https://github.com/CorentinTh/it-tools/issues/new/choose) в репозитории GitHub.

