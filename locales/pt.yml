about:
  content: >
    # Sobre o Toolbox

    Este site maravilhoso junta ferramentas úteis para desenvolvedores e outras pessoas que trabalham com TI. Se você achar o site útil, fique à vontade para compartilhar com quem também possa gostar e não esqueça de salvar o bookmark na sua barra de atalhos!

    O Toolbox é um fork do [IT-Tools](https://github.com/CorentinTh/it-tools), feito com ❤ por [Corentin Thomasset](https://corentin.tech). [destan](https://github.com/destan) mantém este fork.

    O Toolbox é código aberto (sob a licença GPL-3.0), é gratuito, e sempre será.

    ## Tecnologias

    O Toolbox é feito em Vue.js (Vue 3) com a biblioteca de componentes Naive UI e é hospedado pela Cloudflare. Bibliotecas de código aberto de terceiros são usadas em algumas ferramentas e você pode encontrar a lista completa no arquivo [package.json](https://github.com/destan/toolbox/blob/main/package.json) do repositório.

    ## Achou um bug? Está faltando uma ferramenta?

    Se você precisa de uma ferramenta que ainda não existe aqui e acha que pode ser útil, seu pedido será bem vindo na [seção de issues](https://github.com/destan/toolbox/issues/new/choose) no repositório do GitHub.

    E se você encontrar um bug ou se algo não funcionar como esperado, por favor registre um relato de bug na [seção de issues](https://github.com/destan/toolbox/issues/new/choose) no GitHub.

