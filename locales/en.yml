about:
  content: >
    # About IT Tools

    IT Tools is a collection of browser-based utilities for developers, DevOps engineers, and other IT professionals. Tool inputs are processed locally in the browser.

    The original version was created by Corentin Thomasset and is available in the [original IT Tools repository](https://github.com/CorentinTh/it-tools).

    This version is an independently maintained, enhanced fork. Its improvements and current source code are available in the [64mb/it-tools repository](https://github.com/64mb/it-tools).

    ## Technologies

    The application is built with Vue 3, TypeScript, Vite, Naive UI, UnoCSS, and additional open-source libraries. The complete dependency list is available in the fork's [package.json](https://github.com/64mb/it-tools/blob/main/package.json).

    ## Found a bug? A tool is missing?

    Bug reports and feature requests for this version should be submitted through the [fork's issue tracker](https://github.com/64mb/it-tools/issues).

    ## License

    IT Tools is open-source software distributed under the [GNU GPLv3 license](https://github.com/64mb/it-tools/blob/main/LICENSE). The original project and its contributors retain attribution for their work.
  privacy:
    title: Privacy and saved browser data
    description: Tool inputs are processed in this browser and are session-only by default. IT Tools saves only small preferences such as theme, formatting options, favorites, and generator settings.
    textDiff: Text Diff content is saved only after you explicitly enable its bounded local persistence option. OTP seeds are saved only inside the explicitly created encrypted OTP vault. Other secrets, generated tokens, private keys, passwords, and uploaded files are not saved by default.
    clearButton: Clear saved preferences and content
    confirmButton: Clear saved data
    cancelButton: Cancel
    clearConfirm: Clear all browser data saved by IT Tools on this origin? Other same-origin application keys will be preserved.
    clearSuccess: 'Cleared {count} saved IT Tools entries. Active controls may keep their current values until you reload the page.'
    clearPartial: 'Cleared {removed} entries, but the browser denied access to {failed}. Reload the page and review browser storage permissions.'
    clearUnavailable: The browser denied access to local storage. Review this site's storage permissions and try again.

