tools:
  pkcs12-pem-workspace:
    title: PKCS#12 / PEM Workspace
    description: Inspect bounded local PFX archives, export certificates to PEM, and normalize public PEM bundles without exposing private-key material.
  openapi-inspector:
    title: OpenAPI Inspector
    description: Inspect bounded local OpenAPI 3.0/3.1 JSON or YAML, list endpoints, and generate illustrative curl requests and mock payloads.
  devops-secret-helper:
    title: Ansible Vault & htpasswd helper
    description: Encrypt and decrypt compatible Ansible Vault text or generate and verify modern bcrypt htpasswd entries locally
  tabular-data-inspector:
    title: Tabular Data Import & Inspector
    description: Inspect or convert bounded local CSV/TSV with explicit text/type and spreadsheet-safety choices.
  spdx-license-guidance:
    title: SPDX & License Guidance
    description: Browse common SPDX identifiers and triage license-family obligations locally without claiming legal advice.
  aes-gcm-envelope:
    title: AES-GCM Authenticated Envelope
    description: Encrypt bounded text or local files in a versioned authenticated Web Crypto envelope without persisting passphrases.
  image-metadata-remover:
    title: Image Metadata Remover
    description: Remove privacy metadata from bounded JPEG, PNG, and WebP containers locally without recompressing encoded pixels.
  raid-storage-calculator:
    title: RAID & Storage Capacity Calculator
    description: Calculate exact RAID capacity, decimal-versus-binary display, overhead, efficiency, and failure tolerance locally.
  http-request-code-builder:
    title: HTTP Request & Code Builder
    description: Author cURL or fetch request code and import a strict cURL subset locally without executing commands or network requests.
  date-calendar-utilities:
    title: Date, ISO Week & iCalendar Utilities
    description: Convert strict ISO week dates and build or inspect bounded RFC 5545 VEVENT data locally.
  unicode-gsm-inspector:
    title: Unicode & GSM-7 Inspector
    description: Inspect code points, UTF encodings, grapheme counts, normalization, and GSM-7/SMS segment estimates locally.
  list-comparison:
    title: List Comparison
    description: Compare bounded line lists as sets, multisets, or ordered LCS sequences in a local disposable worker.
  markdown-diff:
    title: Markdown Diff
    description: Compare bounded Markdown source locally by line or word and inspect sanitized rendered previews.
  favicon-app-icon-generator:
    title: Favicon & App Icon Generator
    description: Generate bounded favicon, Apple touch, PWA, and maskable PNG icons plus a manifest and TAR bundle from a local image.
  saml-enterprise-inspector:
    title: SAML & Enterprise Timestamp Inspector
    description: Decode bounded Base64 or DEFLATE SAML messages and convert FILETIME or LDAP timestamps locally with explicit trust semantics.
  network-calculation-suite:
    title: Network Calculation Suite
    description: Calculate exact IPv4 and IPv6 CIDRs, exclusions, DHCP Option 43 payloads, port information, and DNS TTL durations offline.
  dns-over-https-query:
    title: DNS-over-HTTPS Query
    description: Send one explicit bounded RFC 8484 wire query to a fixed browser-compatible resolver and inspect the response.
  mermaid-diagram:
    title: Mermaid Diagram Renderer
    description: Explicitly render a restricted bounded Mermaid subset to sanitized isolated SVG or PNG without persisting source.
  parquet-reader:
    title: Parquet Reader
    description: Inspect bounded local Apache Parquet metadata and export a selected row page as JSON or CSV without uploading the file.
  xlsx-reader:
    title: XLSX Spreadsheet Reader
    description: Inspect a bounded local macro-free XLSX workbook and export one selected worksheet page as conservative JSON or CSV.
  developer-text-workspace:
    title: Developer Text Workspace
    description: Format stack traces, replace text, render folder trees, and build Markdown tables of contents in a bounded local worker.
  qr-decoder-otp-import:
    title: QR Decoder & OTP Import
    description: Decode QR images or explicit camera frames locally and inspect bounded TOTP/HOTP provisioning URIs without persistence.
  ed25519-key-workspace:
    title: Ed25519 & SSH Key Workspace
    description: Generate ephemeral Ed25519 keys, OpenSSH public keys, and SHA-256 fingerprints locally with Web Crypto.
  json-code-generator:
    title: JSON Schema & Code Generator
    description: Infer schema/types/stats or generate a bounded lossless-number RFC 6902 JSON Patch locally.
  local-file-inspector:
    title: Local File Inspector
    description: Detect local files by magic bytes, calculate streaming CRC-32, and view a bounded hex preview without uploading content.
  certificate-inspector:
    title: Certificate & CSR Inspector
    description: Inspect bounded X.509, PKCS#10 CSR, and public-key PEM structures locally without uploading or storing key material.
  json-repair-query:
    title: JSON Repair & Query
    description: Repair common JSON5-style syntax or extract data with a bounded JSONPath subset that never executes JavaScript.
  devops-config-workspace:
    title: DevOps Configuration Workspace
    description: Locally lint/format common DevOps files and export selected JSON, YAML, or TOML values as bounded shell-safe .env assignments.
  cli-command-editor:
    title: CLI Command Editor
    description: Parse, inspect, edit, and safely re-quote POSIX shell or PowerShell commands without executing them
